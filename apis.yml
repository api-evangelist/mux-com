- aid: mux-com:mux-com-live-streams-api
  name: Mux Live Streams API
  description: >-
    A Live Stream represents a unique live stream of video being pushed to Mux. It includes configuration
    details (a Stream Key) for live broadcasting software/hardware and a Playback ID for playing the stream
    anywhere. Currently, RTMP is the only supported method of ingesting video. Use rtmp://global-live.mux.com:5222/app
    with the Live Stream's Stream Key for getting the video into Mux, and use https://stream.mux.com with
    the Live Stream's Playback ID for playback.


    A Live Stream can be used once for a specific event, or re-used forever. If you're building an application
    like Facebook Live or Twitch, you could create one Live Stream per user. This allows them to configure
    their broadcasting software once, and the Live Stream Playback ID will always show their latest stream.


    Each RTMP session creates a new video asset automatically. You can set up a webhook to be notified
    each time a broadcast (or Live Stream RTMP session) begins or ends with the video.live_stream.active
    and video.live_stream.idle events respectively. Assets that are created from a Live Stream have the
    same behavior as other Assets you create.


    Learn more about [how to go live in our guides](https://docs.mux.com/guides/start-live-streaming).
  humanURL: https://www.mux.com/docs/api-reference
  baseURL: https://api.mux.com
  tags:
  - Live Streams
