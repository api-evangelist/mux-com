- aid: mux-com:mux-com-delivery-usage-api
  name: Mux Delivery Usage API
  description: >-
    The Delivery Usage API allows you to get delivery/streaming usage details for each asset and across
    all assets. Delivery usage details are aggregated every hour at the top of the hour and can be requested
    for a specified time window within the last 90 days starting at 12 hours prior to when the request
    is made.


    Assets are ordered by delivery usage starting with the one with the highest usage. Only assets with
    delivery usage greater than 0 seconds are returned in the response.
  humanURL: https://www.mux.com/docs/api-reference
  baseURL: https://api.mux.com
