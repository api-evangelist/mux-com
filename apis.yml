description: >-
  Mux is a video infrastructure platform that gives developers an end-to-end API for ingesting, encoding,
  storing, delivering, and analyzing video. The platform spans Mux Video (on-demand and live streaming),
  Mux Data (quality-of-experience analytics), Mux Robots (AI workflows for captions, chapters, summarization,
  and moderation), and Mux Player (drop-in playback components). Mux exposes a unified REST API at
  api.mux.com plus delivery hosts at stream.mux.com, image.mux.com, and stats.mux.com, backed by official
  SDKs in Node, Python, Ruby, PHP, Go, and Elixir, a CLI, and player integrations across web, iOS,
  Android, Roku, and major HTML5 players.
apis:
- aid: mux-com:video-api
  name: Mux Video API
  tags:
  - Video
  - Encoding
  - Assets
  - Direct Uploads
  - Playback
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.mux.com
  humanURL: https://www.mux.com/docs/api-reference
  properties:
  - url: https://www.mux.com/docs/core/stream-video-files
    type: Documentation
  - url: https://www.mux.com/docs/api-reference
    type: APIReference
  - url: openapi/mux-openapi.yml
    type: OpenAPI
  description: >-
    The Mux Video API manages the lifecycle of on-demand video, including Assets, Direct Uploads, Playback
    IDs, URL Signing Keys, Playback Restrictions, DRM Configurations, Transcription Vocabularies, and
    Delivery Usage. Developers can create assets from source URLs or chunked direct uploads, generate
    secure playback IDs (public, signed, or DRM-protected), and retrieve playback manifests, thumbnails,
    GIFs, and storyboards through stream.mux.com and image.mux.com.
- aid: mux-com:live-streaming-api
  name: Mux Live Streaming API
  tags:
  - Live Streaming
  - RTMP
  - SRT
  - Low Latency
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.mux.com
  humanURL: https://www.mux.com/docs/guides/start-live-streaming
  properties:
  - url: https://www.mux.com/docs/guides/start-live-streaming
    type: Documentation
  - url: https://www.mux.com/docs/api-reference#tag/Live-Streams
    type: APIReference
  - url: openapi/mux-openapi.yml
    type: OpenAPI
  description: >-
    Mux Live Streaming creates managed RTMP and SRT ingest endpoints (rtmp://global-live.mux.com:5222/app)
    with reusable stream keys, simulcast targets for restreaming to YouTube, Twitch, and other platforms,
    and live-to-VOD recordings. The API supports standard and low-latency live, auto-generated live
    captions, live stream health monitoring, and disable/enable operations for per-event lifecycle
    management.
- aid: mux-com:data-api
  name: Mux Data API
  tags:
  - Video Analytics
  - Quality Of Experience
  - Monitoring
  - Metrics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.mux.com
  humanURL: https://www.mux.com/docs/core/monitor-your-video-streaming-performance
  properties:
  - url: https://www.mux.com/docs/core/monitor-your-video-streaming-performance
    type: Documentation
  - url: https://www.mux.com/docs/api-reference#tag/Video-Views
    type: APIReference
  - url: openapi/mux-openapi.yml
    type: OpenAPI
  description: >-
    The Mux Data API exposes video quality-of-experience analytics including Video Views, Errors,
    Filters, Dimensions, Exports, Metrics, Monitoring, Real-Time data, Incidents, and Annotations.
    Customers instrument their players with Mux Data SDKs (web, iOS, Android, Roku, Chromecast, ExoPlayer,
    AVPlayer, JWPlayer, THEOplayer) and query aggregated playback quality, viewer engagement, rebuffering,
    startup time, and error rates through this API.
- aid: mux-com:stream-delivery-api
  name: Mux Stream Delivery API
  tags:
  - Delivery
  - HLS
  - DASH
  - Playback
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://stream.mux.com
  humanURL: https://www.mux.com/docs/guides/play-your-videos
  properties:
  - url: https://www.mux.com/docs/guides/play-your-videos
    type: Documentation
  - url: https://www.mux.com/docs/api-reference#tag/Streaming
    type: APIReference
  - url: openapi/mux-openapi.yml
    type: OpenAPI
  description: >-
    The Mux Stream Delivery API serves HLS and DASH playback manifests, captions, transcripts, and
    redundant media segments from stream.mux.com keyed on Playback IDs. It honors signed playback tokens,
    DRM license handshakes, and playback restrictions configured through the Video API to enforce
    domain, geo, and user-agent rules.
- aid: mux-com:image-api
  name: Mux Image API
  tags:
  - Thumbnails
  - Storyboards
  - Animated Images
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://image.mux.com
  humanURL: https://www.mux.com/docs/guides/get-images-from-a-video
  properties:
  - url: https://www.mux.com/docs/guides/get-images-from-a-video
    type: Documentation
  - url: https://www.mux.com/docs/api-reference#tag/Thumbnails
    type: APIReference
  - url: openapi/mux-openapi.yml
    type: OpenAPI
  description: >-
    The Mux Image API generates on-the-fly thumbnails (JPG, PNG, WebP), animated GIFs, and VTT storyboard
    sprites for any asset playback ID via image.mux.com. URL parameters control time offset, width,
    height, fit mode, FPS, and duration, enabling responsive video posters and scrub-bar previews without
    server-side image processing.
- aid: mux-com:robots-ai-api
  name: Mux Robots AI API
  tags:
  - Video AI
  - Captions
  - Summarization
  - Content Moderation
  - Chaptering
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.mux.com
  humanURL: https://www.mux.com/docs/guides/mux-robots
  properties:
  - url: https://www.mux.com/docs/guides/mux-robots
    type: Documentation
  - url: https://www.mux.com/docs/api-reference#tag/Jobs
    type: APIReference
  - url: openapi/mux-openapi.yml
    type: OpenAPI
  description: >-
    Mux Robots is an asynchronous job API for running AI workflows against video assets. Robots include
    Ask Questions (Q&A over a video), Edit Captions, Find Key Moments, Generate Chapters, Moderate
    (NSFW and violence detection), Summarize, and Translate Captions. Jobs follow a pending → processing
    → completed lifecycle and emit robots.job.* webhook events when complete.
- aid: mux-com:system-api
  name: Mux System API
  tags:
  - Signing Keys
  - Account Management
  - Utilities
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.mux.com
  humanURL: https://www.mux.com/docs/api-reference#tag/Signing-Keys
  properties:
  - url: https://www.mux.com/docs/guides/signing-jwts
    type: Documentation
  - url: https://www.mux.com/docs/api-reference#tag/Signing-Keys
    type: APIReference
  - url: openapi/mux-openapi.yml
    type: OpenAPI
  description: >-
    The Mux System API manages account-wide resources such as Signing Keys used to mint short-lived
    JWTs for signed playback URLs, thumbnails, and storyboards, plus utility endpoints (e.g., dimensions
    and account-level metadata) used across Video and Data products.
- aid: mux-com:webhooks
  name: Mux Webhooks
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.mux.com
  humanURL: https://www.mux.com/docs/webhook-reference
  properties:
  - url: https://www.mux.com/docs/system/make-api-requests#webhook-security
    type: Documentation
  - url: https://www.mux.com/docs/webhook-reference
    type: APIReference
  description: >-
    Mux Webhooks deliver signed HTTP callbacks for asset, upload, live stream, and robots job lifecycle
    events (video.asset.created, video.asset.ready, video.live_stream.active, video.upload.asset_created,
    robots.job.completed, and many more). Each delivery carries a Mux-Signature header (HMAC-SHA256
    over the raw body and a per-endpoint secret) and includes attempt history visible in the dashboard.
