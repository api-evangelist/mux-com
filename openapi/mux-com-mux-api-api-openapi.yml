components:
  schemas:
    WebhookAskQuestionsJob:
      type: object
      properties:
        id:
          type: string
          description: Unique job identifier.
        passthrough:
          type: string
          description: Arbitrary string supplied at creation, returned as-is.
        units_consumed:
          type: integer
          minimum: 0
          description: Number of Mux AI units consumed by this job.
        created_at:
          type: integer
          minimum: 0
          description: Unix timestamp (seconds) when the job was created.
        updated_at:
          type: integer
          minimum: 0
          description: Unix timestamp (seconds) when the job was last updated.
        workflow:
          type: string
          enum:
          - ask-questions
        parameters:
          type: object
          properties:
            asset_id:
              type: string
              minLength: 1
              description: The Mux asset ID of the video to analyze.
            questions:
              type: array
              items:
                type: object
                properties:
                  question:
                    type: string
                    minLength: 1
                    description: The question to ask about the video content.
                  answer_options:
                    type: array
                    items:
                      type: string
                      minLength: 1
                    minItems: 1
                    description: Allowed answer values for this question. Defaults to ["yes", "no"] when omitted and free_form_reply is not true. Mutually exclusive with free_form_reply.
                  free_form_reply:
                    type: boolean
                    description: Experimental. When true, the model replies with free-form prose instead of selecting from answer_options. Mutually exclusive with answer_options. Treat the answer as untrusted model output.
                required:
                - question
              minItems: 1
              description: 'One or more questions to ask about the video. Each question can either select from answer_options (defaults to yes/no) or, by setting free_form_reply: true, receive a free-form prose answer.'
            language_code:
              type: string
              minLength: 1
              description: BCP 47 language code of the caption track to analyze (e.g. "en", "fr"). When omitted, the SDK uses the default track.
            max_free_form_answer_length:
              type: integer
              minimum: 1
              default: 500
              description: 'Experimental. Max character length for free-form answers. Ignored unless at least one question sets free_form_reply: true.'
          required:
          - asset_id
          - questions
          example:
            asset_id: mux_asset_123abc
            questions:
            - question: Is this video about glasses?
            - question: What is the primary subject?
              answer_options:
              - glasses
              - watches
              - shoes
              - hats
            - question: Describe the primary subject in one sentence.
              free_form_reply: true
            max_free_form_answer_length: 300
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - errored
          - cancelled
          description: Current job status.
        outputs:
          type: object
          properties:
            answers:
              type: array
              items:
                type: object
                properties:
                  question:
                    type: string
                    minLength: 1
                    description: The original question that was asked.
                  answer:
                    type:
                    - string
                    - 'null'
                    minLength: 1
                    description: For enum questions, constrained to one of the provided answer_options. For free-form questions, responds with prose up to max_free_form_answer_length characters - treat as untrusted model output. Null when the question was skipped.
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Confidence score from 0.0 to 1.0. Values above 0.9 indicate clear, unambiguous evidence; 0.7-0.9 strong evidence with minor ambiguity; 0.5-0.7 moderate evidence; below 0.5 weak or uncertain evidence. Always 0 when skipped.
                  reasoning:
                    type: string
                    minLength: 1
                    description: Explanation citing specific visual or audio evidence from the video, or why the question was skipped.
                  skipped:
                    type: boolean
                    description: Whether the question was skipped due to irrelevance to the video content.
                required:
                - question
                - answer
                - confidence
                - reasoning
                - skipped
              minItems: 1
              description: One answer per question, in the same order as the input questions.
          required:
          - answers
          example:
            answers:
            - question: Is this video about glasses?
              answer: 'no'
              confidence: 0.92
              reasoning: No glasses appear on screen and the narration does not mention eyewear.
              skipped: false
            - question: What is the primary subject?
              answer: watches
              confidence: 0.88
              reasoning: Multiple wristwatches are featured prominently throughout the video.
              skipped: false
            - question: Describe the primary subject in one sentence.
              answer: A close-up showcase of luxury wristwatches arranged on a wooden display.
              confidence: 0.86
              reasoning: Visual evidence shows several wristwatches displayed against a wooden backdrop with no other competing subjects.
              skipped: false
          description: Workflow results. Present when status is 'completed'.
        errors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: Stable public error category identifier.
              message:
                type: string
                description: Human-readable public error message.
              retryable:
                type: boolean
                description: Whether retrying this job may resolve the error.
            required:
            - type
            - message
          description: Error details. Present when status is 'errored'.
        resources:
          type: object
          properties:
            assets:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Mux asset ID.
                  meta:
                    type: object
                    properties:
                      title:
                        type: string
                        description: Asset title from Mux metadata.
                      creator_id:
                        type: string
                        description: Creator identifier from Mux metadata.
                      external_id:
                        type: string
                        description: External identifier from Mux metadata.
                    description: Mux asset metadata, if available.
                  passthrough:
                    type: string
                    description: Passthrough string from the Mux asset.
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            description: URL to the Mux asset resource.
                        required:
                        - href
                    required:
                    - self
                    description: Hypermedia links for the asset.
                required:
                - id
                - _links
              description: Mux assets associated with this job.
          required:
          - assets
          example:
            assets:
            - id: abc123asset
              meta:
                title: My Video
                creator_id: user123
                external_id: ext456
              _links:
                self:
                  href: https://api.mux.com/video/v1/assets/abc123asset
          description: Related Mux resources linked to this job.
      required:
      - id
      - units_consumed
      - created_at
      - updated_at
      - workflow
      - parameters
      - status
      description: The job that triggered the webhook event. In the actual payload this is nested under a dynamic event name key (e.g. `robots.job.summarize.completed`), not at the top level.
    WebhookVideoDeliveryHighTraffic:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            required:
            - asset_id
            - asset_state
            - asset_resolution_tier
            - asset_encoding_tier
            - asset_duration
            - created_at
            - delivered_seconds
            - delivered_seconds_by_resolution
            properties:
              live_stream_id:
                type: string
                description: Unique identifier for the live stream that created the asset.
              asset_id:
                type: string
                description: Unique identifier for the asset.
              passthrough:
                type: string
                description: The `passthrough` value for the asset.
              created_at:
                type: integer
                format: int32
                description: Time at which the asset was created. Measured in seconds since the Unix epoch.
              deleted_at:
                type: integer
                format: int32
                description: If exists, time at which the asset was deleted. Measured in seconds since the Unix epoch.
              asset_state:
                type: string
                enum:
                - ready
                - errored
                - deleted
                description: The state of the asset.
              asset_duration:
                type: number
                format: double
                description: The duration of the asset in seconds.
              asset_resolution_tier:
                type: string
                enum:
                - audio-only
                - 720p
                - 1080p
                - 1440p
                - 2160p
                description: The resolution tier that the asset was ingested at, affecting billing for ingest & storage
              asset_encoding_tier:
                type: string
                deprecated: true
                enum:
                - smart
                - baseline
                - premium
                description: This field is deprecated. Please use `asset_video_quality` instead. The encoding tier that the asset was ingested at. [See the video quality guide for more details.](https://docs.mux.com/guides/use-video-quality-levels)
              asset_video_quality:
                type: string
                enum:
                - basic
                - plus
                - premium
                description: The video quality that the asset was ingested at. This field replaces `asset_encoding_tier`. [See the video quality guide for more details.](https://docs.mux.com/guides/use-video-quality-levels)
              delivered_seconds:
                type: number
                format: double
                description: Total number of delivered seconds during this time window.
              delivered_seconds_by_resolution:
                type: object
                description: Seconds delivered broken into resolution tiers. Each tier will only be displayed if there was content delivered in the tier.
                properties:
                  tier_2160p:
                    type: number
                    format: double
                    description: Total number of delivered seconds during this time window that had a resolution larger than the 1440p tier (over 4,194,304 pixels total).
                  tier_1440p:
                    type: number
                    format: double
                    description: Total number of delivered seconds during this time window that had a resolution larger than the 1080p tier but less than or equal to the 2160p tier (over 2,073,600 and <= 4,194,304 pixels total).
                  tier_1080p:
                    type: number
                    format: double
                    description: Total number of delivered seconds during this time window that had a resolution larger than the 720p tier but less than or equal to the 1440p tier (over 921,600 and <= 2,073,600 pixels total).
                  tier_720p:
                    type: number
                    format: double
                    description: Total number of delivered seconds during this time window that had a resolution within the 720p tier (up to 921,600 pixels total, based on typical 1280x720).
                  tier_audio_only:
                    type: number
                    format: double
                    description: Total number of delivered seconds during this time window that had a resolution of audio only.
        timeframe:
          type: array
          items:
            type: integer
            format: int64
        threshold:
          type: integer
          format: int64
          description: Current threshold set for alerting
        id:
          type: string
    WebhookSimulcastTarget:
      type: object
      required:
      - id
      - url
      - status
      properties:
        id:
          type: string
          description: ID of the Simulcast Target
        passthrough:
          type: string
          description: Arbitrary user-supplied metadata set when creating a simulcast target.
        status:
          type: string
          enum:
          - idle
          - starting
          - broadcasting
          - errored
          description: "The current status of the simulcast target. See Statuses below for detailed description.\n  * `idle`: Default status. When the parent live stream is in disconnected status, simulcast targets will be idle state.\n  * `starting`: The simulcast target transitions into this state when the parent live stream transition into connected state.\n  * `broadcasting`: The simulcast target has successfully connected to the third party live streaming service and is pushing video to that service.\n  * `errored`: The simulcast target encountered an error either while attempting to connect to the third party live streaming service, or mid-broadcasting. When a simulcast target has this status it will have an `error_severity` field with more details about the error.\n"
        stream_key:
          type: string
          description: Stream Key represents a stream identifier on the third party live streaming service to send the parent live stream to. Only used for RTMP(s) simulcast destinations.
        url:
          type: string
          description: 'The RTMP(s) or SRT endpoint for a simulcast destination.

            * For RTMP(s) destinations, this should include the application name for the third party live streaming service, for example: `rtmp://live.example.com/app`.

            * For SRT destinations, this should be a fully formed SRT connection string, for example: `srt://srt-live.example.com:1234?streamid={stream_key}&passphrase={srt_passphrase}`.


            Note: SRT simulcast targets can only be used when an source is connected over SRT.

            '
        error_severity:
          type: string
          enum:
          - normal
          - fatal
          description: "The severity of the error encountered by the simulcast target.\nThis field is only set when the simulcast target is in the `errored` status.\nSee the values of severities below and their descriptions.\n  * `normal`: The simulcast target encountered an error either while attempting to connect to the third party live streaming service, or mid-broadcasting. A simulcast may transition back into the broadcasting state if a connection with the service can be re-established.\n  * `fatal`: The simulcast target is incompatible with the current input to the parent live stream. No further attempts to this simulcast target will be made for the current live stream asset.\n"
        live_stream_id:
          type: string
          description: Unique identifier for the Live Stream. Max 255 characters.
    WebhookAsset:
      type: object
      required:
      - id
      - created_at
      - status
      - max_resolution_tier
      - encoding_tier
      - master_access
      - progress
      properties:
        id:
          type: string
          description: Unique identifier for the Asset. Max 255 characters.
        created_at:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - preparing
          - ready
          - errored
          description: The status of the asset.
        duration:
          type: number
          format: double
          description: The duration of the asset in seconds (max duration for a single asset is 12 hours).
        max_stored_resolution:
          type: string
          enum:
          - Audio only
          - SD
          - HD
          - FHD
          - UHD
          description: This field is deprecated. Please use `resolution_tier` instead. The maximum resolution that has been stored for the asset. The asset may be delivered at lower resolutions depending on the device and bandwidth, however it cannot be delivered at a higher value than is stored.
          deprecated: true
        resolution_tier:
          type: string
          enum:
          - audio-only
          - 720p
          - 1080p
          - 1440p
          - 2160p
          description: The resolution tier that the asset was ingested at, affecting billing for ingest & storage. This field also represents the highest resolution tier that the content can be delivered at, however the actual resolution may be lower depending on the device, bandwidth, and exact resolution of the uploaded asset.
        max_resolution_tier:
          type: string
          enum:
          - 1080p
          - 1440p
          - 2160p
          description: Max resolution tier can be used to control the maximum `resolution_tier` your asset is encoded, stored, and streamed at. If not set, this defaults to `1080p`.
        encoding_tier:
          type: string
          deprecated: true
          enum:
          - smart
          - baseline
          - premium
          description: This field is deprecated. Please use `video_quality` instead. The encoding tier informs the cost, quality, and available platform features for the asset. The default encoding tier for an account can be set in the Mux Dashboard. [See the video quality guide for more details.](https://docs.mux.com/guides/use-video-quality-levels)
        video_quality:
          type: string
          enum:
          - basic
          - plus
          - premium
          description: The video quality controls the cost, quality, and available platform features for the asset. The default video quality for an account can be set in the Mux Dashboard. This field replaces the deprecated `encoding_tier` value. [See the video quality guide for more details.](https://docs.mux.com/guides/use-video-quality-levels)
        max_stored_frame_rate:
          type: number
          format: double
          description: The maximum frame rate that has been stored for the asset. The asset may be delivered at lower frame rates depending on the device and bandwidth, however it cannot be delivered at a higher value than is stored. This field may return -1 if the frame rate of the input cannot be reliably determined.
        aspect_ratio:
          type: string
          description: The aspect ratio of the asset in the form of `width:height`, for example `16:9`.
        playback_ids:
          type: array
          description: An array of Playback ID objects. Use these to create HLS playback URLs. See [Play your videos](https://docs.mux.com/guides/play-your-videos) for more details.
          items:
            type: object
            required:
            - id
            - policy
            properties:
              id:
                type: string
                description: Unique identifier for the PlaybackID
              policy:
                type: string
                enum:
                - public
                - signed
                - drm
                description: '* `public` playback IDs are accessible by constructing an HLS URL like `https://stream.mux.com/${PLAYBACK_ID}`


                  * `signed` playback IDs should be used with tokens `https://stream.mux.com/${PLAYBACK_ID}?token={TOKEN}`. See [Secure video playback](https://docs.mux.com/guides/secure-video-playback) for details about creating tokens.


                  * `drm` playback IDs are protected with DRM technologies. [See DRM documentation for more details](https://docs.mux.com/guides/protect-videos-with-drm).

                  '
              drm_configuration_id:
                type: string
                description: The DRM configuration used by this playback ID. Must only be set when `policy` is set to `drm`.
        tracks:
          type: array
          description: The individual media tracks that make up an asset.
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the Track
              type:
                type: string
                description: The type of track
                enum:
                - video
                - audio
                - text
              duration:
                type: number
                format: double
                description: The duration in seconds of the track media. This parameter is not set for `text` type tracks. This field is optional and may not be set. The top level `duration` field of an asset will always be set.
              max_width:
                type: integer
                format: int64
                description: The maximum width in pixels available for the track. Only set for the `video` type track.
              max_height:
                type: integer
                format: int64
                description: The maximum height in pixels available for the track. Only set for the `video` type track.
              max_frame_rate:
                type: number
                format: double
                description: The maximum frame rate available for the track. Only set for the `video` type track. This field may return `-1` if the frame rate of the input cannot be reliably determined.
              max_channels:
                type: integer
                format: int64
                description: The maximum number of audio channels the track supports. Only set for the `audio` type track.
              max_channel_layout:
                type: string
                description: Only set for the `audio` type track.
                deprecated: true
              text_type:
                type: string
                enum:
                - subtitles
                description: This parameter is only set for `text` type tracks.
              text_source:
                type: string
                description: 'The source of the text contained in a Track of type `text`. Valid `text_source`

                  values are listed below.

                  * `uploaded`: Tracks uploaded to Mux as caption or subtitle files using the Create Asset Track API.

                  * `embedded`: Tracks extracted from an embedded stream of CEA-608 closed captions.

                  * `generated_vod`: Tracks generated by automatic speech recognition on an on-demand asset.

                  * `generated_live`: Tracks generated by automatic speech recognition on a live stream configured with `generated_subtitles`. If an Asset has both `generated_live` and `generated_live_final` tracks that are `ready`, then only the `generated_live_final` track will be included during playback.

                  * `generated_live_final`: Tracks generated by automatic speech recognition on a live stream using `generated_subtitles`. The accuracy, timing, and formatting of these subtitles is improved compared to the corresponding `generated_live` tracks. However, `generated_live_final` tracks will not be available in `ready` status until the live stream ends. If an Asset has both `generated_live` and `generated_live_final` tracks that are `ready`, then only the `generated_live_final` track will be included during playback.

                  '
                enum:
                - uploaded
                - embedded
                - generated_live
                - generated_live_final
                - generated_vod
              language_code:
                type: string
                description: The language code value represents [BCP 47](https://tools.ietf.org/html/bcp47) specification compliant value, or 'auto'. For example, `en` for English or `en-US` for the US version of English. This parameter is only set for `text` and `audio` track types. During automatic language detection for generated subtitles, this value will be set to `auto` until the language is determined.
              name:
                type: string
                description: The name of the track containing a human-readable description. The HLS manifest will associate a subtitle `text` or `audio` track with this value. For example, the value should be "English" for a subtitle text track for the `language_code` value of `en-US`. This parameter is only set for `text` and `audio` track types.
              closed_captions:
                type: boolean
                description: Indicates the track provides Subtitles for the Deaf or Hard-of-hearing (SDH). This parameter is only set tracks where `type` is `text` and `text_type` is `subtitles`.
              passthrough:
                type: string
                description: Arbitrary user-supplied metadata set for the track either when creating the asset or track. This parameter is only set for `text` type tracks. Max 255 characters.
              status:
                type: string
                enum:
                - preparing
                - ready
                - errored
                - deleted
                description: The status of the track. This parameter is only set for `text` type tracks.
              primary:
                type: boolean
                description: For an audio track, indicates that this is the primary audio track, ingested from the main input for this asset. The primary audio track cannot be deleted.
              auto_language_confidence:
                type: number
                format: double
                description: The confidence value (0-1) of the determined language. This value only is available when automatic language detection is utilized in generated subtitles.
              error:
                type: object
                description: Object that describes any errors that happened when processing this asset.
                properties:
                  type:
                    type: string
                    description: The type of error that occurred for this asset.
                  messages:
                    type: array
                    description: Error messages with more details.
                    items:
                      type: string
        errors:
          type: object
          description: Object that describes any errors that happened when processing this asset.
          properties:
            type:
              type: string
              description: The type of error that occurred for this asset.
            messages:
              type: array
              description: Error messages with more details.
              items:
                type: string
        per_title_encode:
          type: boolean
          format: boolean
          x-mux-doc-decorators:
          - hidden
          deprecated: true
        upload_id:
          type: string
          description: Unique identifier for the Direct Upload. This is an optional parameter added when the asset is created from a direct upload.
        is_live:
          type: boolean
          format: boolean
          description: Indicates whether the live stream that created this asset is currently `active` and not in `idle` state. This is an optional parameter added when the asset is created from a live stream.
        passthrough:
          type: string
          description: 'You can set this field to anything you want. It will be included in the asset details and related webhooks. If you''re looking for more structured metadata, such as `title` or `external_id` , you can use the `meta` object instead. **Max: 255 characters**.'
        live_stream_id:
          type: string
          description: Unique identifier for the live stream. This is an optional parameter added when the asset is created from a live stream.
        master:
          type: object
          description: An object containing the current status of Master Access and the link to the Master MP4 file when ready. This object does not exist if `master_access` is set to `none` and when the temporary URL expires.
          properties:
            status:
              enum:
              - ready
              - preparing
              - errored
              type: string
            url:
              type: string
              description: The temporary URL to the master version of the video, as an MP4 file. This URL will expire after 24 hours.
        master_access:
          type: string
          enum:
          - temporary
          - none
          default: none
        mp4_support:
          type: string
          deprecated: true
          default: none
          enum:
          - standard
          - none
          - capped-1080p
          - audio-only
          - audio-only,capped-1080p
          x-mux-doc-decorators-deprecated-enum-values:
          - standard
        source_asset_id:
          type: string
          description: Asset Identifier of the video used as the source for creating the clip.
        normalize_audio:
          type: boolean
          default: false
          description: Normalize the audio track loudness level. This parameter is only applicable to on-demand (not live) assets.
        static_renditions:
          type: object
          description: An object containing the current status of any static renditions (mp4s). The object does not exist if no static renditions have been requested. See [Download your videos](https://docs.mux.com/guides/enable-static-mp4-renditions) for more information.
          properties:
            status:
              type: string
              default: disabled
              description: Indicates the status of downloadable MP4 versions of this asset. This field is only valid when `mp4_support` is enabled
              enum:
              - ready
              - preparing
              - disabled
              - errored
            files:
              type: array
              description: Array of file objects.
              items:
                type: object
                properties:
                  name:
                    type: string
                    enum:
                    - low.mp4
                    - medium.mp4
                    - high.mp4
                    - highest.mp4
                    - audio.m4a
                    - capped-1080p.mp4
                    - 2160p.mp4
                    - 1440p.mp4
                    - 1080p.mp4
                    - 720p.mp4
                    - 540p.mp4
                    - 480p.mp4
                    - 360p.mp4
                    - 270p.mp4
                    description: Name of the static rendition file
                  ext:
                    type: string
                    description: Extension of the static rendition file
                    enum:
                    - mp4
                    - m4a
                  height:
                    type: integer
                    format: int32
                    description: The height of the static rendition's file in pixels
                  width:
                    type: integer
                    format: int32
                    description: The width of the static rendition's file in pixels
                  bitrate:
                    type: integer
                    format: int64
                    description: The bitrate in bits per second
                  filesize:
                    type: integer
                    format: int64
                    description: The file size in bytes
                  type:
                    type: string
                    description: Indicates the static rendition type of this specific MP4 version of this asset. This field is only valid for `static_renditions`, not for `mp4_support`.
                    enum:
                    - standard
                    - advanced
                  status:
                    type: string
                    description: 'Indicates the status of this specific MP4 version of this asset. This field is only valid for `static_renditions`, not for `mp4_support`.

                      * `ready` indicates the MP4 has been generated and is ready for download

                      * `preparing` indicates the asset has not been ingested or the static rendition is still being generated after an asset is ready

                      * `skipped` indicates the static rendition will not be generated because the requested resolution conflicts with the asset attributes after the asset has been ingested

                      * `errored` indicates the static rendition cannot be generated. For example, an asset could not be ingested

                      '
                    enum:
                    - ready
                    - preparing
                    - skipped
                    - errored
                  resolution_tier:
                    type: string
                    description: Indicates the resolution tier of this specific MP4 version of this asset. This field is only valid for `static_renditions`, not for `mp4_support`.
                    enum:
                    - 2160p
                    - 1440p
                    - 1080p
                    - 720p
                    - audio-only
                  resolution:
                    type: string
                    description: Indicates the resolution of this specific MP4 version of this asset. This field is only valid for `static_renditions`, not for `mp4_support`.
                    enum:
                    - highest
                    - audio-only
                    - 2160p
                    - 1440p
                    - 1080p
                    - 720p
                    - 540p
                    - 480p
                    - 360p
                    - 270p
                    x-mux-doc-decorators-hidden-enum-values:
                    - 2160p
                    - 1440p
                    - 1080p
                    - 720p
                    - 540p
                    - 480p
                    - 360p
                    - 270p
                  id:
                    type: string
                    description: The ID of this static rendition, used in managing this static rendition. This field is only valid for `static_renditions`, not for `mp4_support`.
                  passthrough:
                    type: string
                    description: Arbitrary user-supplied metadata set for the static rendition. Max 255 characters.
        recording_times:
          type: array
          description: An array of individual live stream recording sessions. A recording session is created on each encoder connection during the live stream. Additionally any time slate media is inserted during brief interruptions in the live stream media or times when the live streaming software disconnects, a recording session representing the slate media will be added with a "slate" type.
          items:
            type: object
            properties:
              started_at:
                type: object
                properties:
                  nanos:
                    format: int32
                    type: integer
                  seconds:
                    format: int32
                    type: integer
                required:
                - seconds
              duration:
                type: number
                format: double
                description: The duration of the live stream recorded. The time value is in seconds.
              type:
                type: string
                enum:
                - content
                - slate
                description: The type of media represented by the recording session, either `content` for normal stream content or `slate` for slate media inserted during stream interruptions.
        non_standard_input_reasons:
          type: object
          description: An object containing one or more reasons the input file is non-standard. See [the guide on minimizing processing time](https://docs.mux.com/guides/minimize-processing-time) for more information on what a standard input is defined as. This object only exists on on-demand assets that have non-standard inputs, so if missing you can assume the input qualifies as standard.
          properties:
            video_codec:
              type: string
              description: The video codec used on the input file. For example, the input file encoded with `av1` video codec is non-standard and the value of this parameter is `av1`.
            audio_codec:
              type: string
              description: The audio codec used on the input file. Non-AAC audio codecs are non-standard.
            video_gop_size:
              type: string
              enum:
              - high
              description: The video key frame Interval (also called as Group of Picture or GOP) of the input file is `high`. This parameter is present when the gop is greater than 20 seconds.
            video_frame_rate:
              type: string
              description: The video frame rate of the input file. Video with average frames per second (fps) less than 5 or greater than 120 is non-standard. A `-1` frame rate value indicates Mux could not determine the frame rate of the video track.
            video_resolution:
              type: string
              description: The video resolution of the input file. Video resolution higher than 2048 pixels on any one dimension (height or width) is considered non-standard, The resolution value is presented as `width` x `height` in pixels.
            video_bitrate:
              type: string
              enum:
              - high
              description: The video bitrate of the input file is `high`. This parameter is present when the average bitrate of any key frame interval (also known as Group of Pictures or GOP) is higher than what's considered standard which typically is 16 Mbps.
            pixel_aspect_ratio:
              type: string
              description: The video pixel aspect ratio of the input file.
            video_edit_list:
              type: string
              enum:
              - non-standard
              description: Video Edit List reason indicates that the input file's video track contains a complex Edit Decision List.
            audio_edit_list:
              type: string
              enum:
              - non-standard
              description: Audio Edit List reason indicates that the input file's audio track contains a complex Edit Decision List.
            unexpected_media_file_parameters:
              type: string
              enum:
              - non-standard
              description: A catch-all reason when the input file in created with non-standard encoding parameters.
            unsupported_pixel_format:
              type: string
              description: The video pixel format, as a string, returned by libav. Considered non-standard if not one of yuv420p or yuvj420p. HEVC inputs additionally permit yuv420p10le.
            unexpected_video_parameters:
              type: string
        test:
          type: boolean
          format: boolean
          description: True means this live stream is a test asset. A test asset can help evaluate the Mux Video APIs without incurring any cost. There is no limit on number of test assets created. Test assets are watermarked with the Mux logo, limited to 10 seconds, and deleted after 24 hrs.
        ingest_type:
          type: string
          enum:
          - on_demand_url
          - on_demand_direct_upload
          - on_demand_clip
          - live_rtmp
          - live_srt
          description: The type of ingest used to create the asset.
        meta:
          type: object
          description: 'Customer provided metadata about this asset.


            Note: This metadata may be publicly available via the video player. Do not include PII or sensitive information.

            '
          properties:
            title:
              type: string
              maxLength: 512
              description: The asset title. Max 512 code points.
            creator_id:
              type: string
              maxLength: 128
              description: This is an identifier you provide to keep track of the creator of the asset. Max 128 code points.
            external_id:
              type: string
              maxLength: 128
              description: This is an identifier you provide to link the asset to your own data. Max 128 code points.
        progress:
          type: object
          description: Detailed state information about the asset ingest process.
          properties:
            state:
              type: string
              enum:
              - ingesting
              - transcoding
              - completed
              - live
              - errored
              description: 'The detailed state of the asset ingest process. This field is useful for relaying more granular processing information to end users when a [non-standard input is encountered](https://www.mux.com/docs/guides/minimize-processing-time#non-standard-input).


                - `ingesting`: Asset is being ingested (initial processing before or after transcoding). While in this state, the `progress` percentage will be 0.

                - `transcoding`: Asset is undergoing non-standard transcoding.

                - `completed`: Asset processing is complete (`status` is `ready`). While in this state, the `progress` percentage will be 100.

                - `live`: Asset is a live stream currently in progress. While in this state, the `progress` percentage will be -1.

                - `errored`: Asset has encountered an error (`status` is `errored`). While in this state, the `progress` percentage will be -1.

                '
            progress:
              type: number
              format: double
              minimum: -1
              maximum: 100
              description: Represents the estimated completion percentage. Returns `0 - 100` when in `ingesting`, `transcoding`, or `completed` state, and `-1` when in `live` or `errored` state.
          required:
          - state
          - progress
    WebhookModerateJob:
      type: object
      properties:
        id:
          type: string
          description: Unique job identifier.
        passthrough:
          type: string
          description: Arbitrary string supplied at creation, returned as-is.
        units_consumed:
          type: integer
          minimum: 0
          description: Number of Mux AI units consumed by this job.
        created_at:
          type: integer
          minimum: 0
          description: Unix timestamp (seconds) when the job was created.
        updated_at:
          type: integer
          minimum: 0
          description: Unix timestamp (seconds) when the job was last updated.
        workflow:
          type: string
          enum:
          - moderate
        parameters:
          type: object
          properties:
            asset_id:
              type: string
              minLength: 1
              description: The Mux asset ID of the video to moderate.
            language_code:
              type: string
              minLength: 1
              default: en
              description: BCP 47 language code for transcript analysis. Used only for audio-only assets; ignored for video assets with visual content. If omitted for audio-only assets, the first ready text track is used. Defaults to "en".
            thresholds:
              type: object
              properties:
                sexual:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: Score threshold for sexual content. Content scoring above this value triggers exceeds_threshold.
                violence:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: Score threshold for violent content. Content scoring above this value triggers exceeds_threshold.
              default:
                sexual: 0.7
                violence: 0.8
              description: 'Score thresholds that determine whether content is flagged. When combined with sampling_interval or max_samples, the exceeds_threshold flag reflects whether any category''s highest observed score exceeds its configured threshold. Defaults to {sexual: 0.7, violence: 0.8}.'
            sampling_interval:
              type: integer
              minimum: 5
              description: Interval, in seconds, between sampled thumbnails. Minimum 5 seconds. When max_samples is also set, the actual sampling density is the more restrictive of the two constraints.
            max_samples:
              type: integer
              minimum: 1
