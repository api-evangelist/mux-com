                description: A name for this live stream subtitle track.
              passthrough:
                type: string
                description: Arbitrary metadata set for the live stream subtitle track. Max 255 characters.
              language_code:
                type: string
                description: The language of the audio from which subtitles are generated.
                default: en
                enum:
                - en
                - en-US
                - es
                - fr
